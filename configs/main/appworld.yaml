schema_version: 1

provenance:
  dataset: AppWorld
  package: appworld
  package_version: 0.1.3.post1
  benchmark_repository: https://github.com/StonyBrookNLP/appworld
  note: >-
    Main experiments used the official train, dev, and test_normal splits. The
    environment server is launched with the active Python interpreter.

environment: {}

paths:
  manifest: data/splits/appworld_official/train/items.json
  selection_manifest: data/splits/appworld_official/dev/items.json
  test_manifest: data/splits/appworld_official/test_normal/items.json
  skill_bank: skills/appworld_initial.md
  appworld_data_dir: ${APPWORLD_DATA_DIR:-/path/to/appworld/data}
  evidence_embedding_model: ${EVIDENCE_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}

defaults:
  watcher:
    max_restarts: -1
    sleep_seconds: 120
  arguments:
    dataset: appworld
    epochs: 4
    bundle_size: 4
    bundle_sampling_strategy: shuffle_epoch
    l1_trajectory_minibatch_size: 4
    max_steps: 50
    seed: 42
    action_llm_kind: openai
    action_temperature: 0.7
    action_max_retries: -1
    action_timeout: 300
    action_reasoning_effort: medium
    teacher_model: gpt-5.5
    llm_kind: openai
    teacher_base_url: ${OPENAI_BASE_URL}
    teacher_max_tokens: 4096
    teacher_max_retries: -1
    teacher_timeout: 300
    teacher_reasoning_effort: medium
    appworld_auto_server: true
    appworld_server_host: 127.0.0.1
    appworld_server_port_start: ${APPWORLD_SERVER_PORT_START:-23300}
    appworld_env_timeout: 100
    appworld_action_history_length: 8
    appworld_random_seed: 100
    llm_max_input_chars: 60000
    llm_max_observation_chars: 3000
    l2_evidence_window_grouping: semantic
    evidence_embedding_device: cpu
    semantic_window_min_evidence: 8
    semantic_window_max_evidence: 15
    epoch_skill_update_mode: cluster_step
    epoch_edit_budget: 128
    epoch_merge_max_candidates: 8
    l2_selection_size: 57
    l2_replay_ranges_per_edit: 3
    post_reject_replay_cap: 15
    working_branch_provisional_cap: 16
    working_branch_defer_uncovered_evidence: true
    working_branch_defer_rule_ignored: true
    working_branch_max_policy_defer_epochs: 2
    epoch_trajectory_comparison_tasks: 0
    epoch_final_replay_ranges_per_edit: 0
    selection_accept_tie: false
    no_l2_selection_feedback: true
    use_evidence_working_branch: true

profiles:
  gpt-5.5:
    arguments:
      action_model: gpt-5.5
      action_base_url: ${OPENAI_BASE_URL}
      action_max_new_tokens: 4096
      output_dir: ${OUTPUT_ROOT:-outputs/eviskill/main_results}/appworld_gpt5.5
  qwen3.5-4b:
    arguments:
      action_model: Qwen3.5-4B
      action_base_url: ${OPENAI_BASE_URL}
      action_max_new_tokens: 2048
      action_thinking: disabled
      action_reasoning_effort: none
      action_extra_body_json:
        chat_template_kwargs:
          enable_thinking: false
      working_branch_provisional_cap: 8
      output_dir: ${OUTPUT_ROOT:-outputs/eviskill/main_results}/appworld_qwen3.5-4b
