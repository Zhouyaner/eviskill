schema_version: 1

provenance:
  dataset: ALFWorld
  benchmark_repository: https://github.com/alfworld/alfworld
  environment_revision: >-
    ALFWorld runtime checkout used for the experiments; archive the exact
    checkout when publishing runs.
  note: >-
    The experiment uses the json_2.1.1 data layout and the TextWorld runtime.

# These are the only benchmark data paths that need machine-local editing.
# The launcher exports ALFWORLD_DATA before starting the benchmark.
environment:
  ALFWORLD_DATA: ${ALFWORLD_DATA:-/path/to/alfworld/data}

paths:
  manifest: data/splits/alfworld_main/train/items.json
  selection_manifest: data/splits/alfworld_main/val/items.json
  test_manifest: data/splits/alfworld_main/test/items.json
  skill_bank: skills/alfworld_initial.md
  # Leave alfworld_path empty when ALFWorld is installed in the active Python
  # environment. Set ALFWORLD_PATH only for a source checkout installation.
  alfworld_path: ${ALFWORLD_PATH:-}
  # This is the EviSkill-owned runtime configuration; only the data root is
  # machine-local through ALFWORLD_DATA.
  alfworld_config: ${ALFWORLD_CONFIG:-configs/alfworld/config_tw.yaml}
  evidence_embedding_model: ${EVIDENCE_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}

defaults:
  watcher:
    max_restarts: -1
    sleep_seconds: 120
  arguments:
    dataset: alfworld
    epochs: 4
    bundle_size: 4
    bundle_sampling_strategy: shuffle_epoch
    l1_trajectory_minibatch_size: 4
    max_steps: 50
    seed: 42
    action_llm_kind: openai
    action_temperature: 0.7
    action_max_new_tokens: 4096
    action_max_retries: -1
    action_timeout: 300
    action_reasoning_effort: medium
    teacher_model: gpt-5.5
    llm_kind: openai
    teacher_base_url: ${OPENAI_BASE_URL}
    teacher_max_tokens: 4096
    teacher_max_retries: -1
    teacher_timeout: 300
    teacher_reasoning_effort: medium
    alfworld_action_history_length: 8
    alfworld_max_resets_to_find_task: 512
    llm_max_input_chars: 60000
    llm_max_observation_chars: 3000
    l2_evidence_window_grouping: semantic
    evidence_embedding_device: cpu
    semantic_window_min_evidence: 4
    semantic_window_max_evidence: 20
    epoch_skill_update_mode: cluster_step
    epoch_edit_budget: 128
    epoch_merge_max_candidates: 8
    l2_selection_size: 48
    l2_replay_ranges_per_edit: 3
    post_reject_replay_cap: 15
    working_branch_provisional_cap: 16
    epoch_trajectory_comparison_tasks: 0
    epoch_final_replay_ranges_per_edit: 0
    selection_accept_tie: false
    no_l2_selection_feedback: true
    use_evidence_working_branch: true
    working_branch_defer_rule_ignored: true
    working_branch_max_policy_defer_epochs: 2

profiles:
  gpt-5.5:
    arguments:
      action_model: gpt-5.5
      action_base_url: ${OPENAI_BASE_URL}
      output_dir: ${OUTPUT_ROOT:-outputs/eviskill/main_results}/alfworld_gpt5.5
  qwen3.5-4b:
    arguments:
      action_model: Qwen3.5-4B
      action_base_url: ${OPENAI_BASE_URL}
      action_thinking: disabled
      action_reasoning_effort: none
      action_extra_body_json:
        chat_template_kwargs:
          enable_thinking: false
      output_dir: ${OUTPUT_ROOT:-outputs/eviskill/main_results}/alfworld_qwen3.5-4b
