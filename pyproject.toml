[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eviskill"
version = "0.1.0"
description = "Evidence-grounded skill evolution with replay and validation-gated working-skill carryover"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "tqdm>=4.66",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["wmsm*"]

[tool.setuptools.package-data]
"wmsm.prompts" = ["*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
